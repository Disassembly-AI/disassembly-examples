name: disassembly-scan
on:
  pull_request:
  schedule: [{ cron: "0 6 * * 1" }]   # weekly Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      target: { description: "Target URL", required: true, default: "https://staging.example.com" }

permissions:
  contents: read
  security-events: write               # required to upload SARIF

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # Option A — native Action (recommended)
      - name: Disassembly scan
        uses: disassembly-ai/scan-action@v1
        with:
          target: ${{ github.event.inputs.target || vars.SCAN_TARGET }}
        env:
          DISASSEMBLY_API_KEY: ${{ secrets.DISASSEMBLY_API_KEY }}

      # Option B — plain container (same result, any runner)
      # - run: |
      #     docker run --rm -e DISASSEMBLY_API_KEY \
      #       ghcr.io/disassembly-ai/toolkit:latest \
      #       scan "$TARGET" --ci > report.sarif
      #   env:
      #     DISASSEMBLY_API_KEY: ${{ secrets.DISASSEMBLY_API_KEY }}
      #     TARGET: ${{ vars.SCAN_TARGET }}

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: report.sarif
